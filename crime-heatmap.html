<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SecureStep — Crime Heatmap</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css">
  <style>
    :root{--blue:#1e3a5f;--lightBlue:#2c5282;--accent:#4fc3f7;--danger:#ef4444;--muted:#64748b;--card:#fff}
    *{box-sizing:border-box}
    body{font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif;margin:0;background:linear-gradient(180deg,#f0f7ff 0%,#fff 100%);color:#0f172a}
    .container{max-width:1200px;margin:20px auto;padding:16px}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
    .brand{display:flex;align-items:center;gap:10px}
    .brand i{color:var(--accent);font-size:22px}
    .layout{display:grid;grid-template-columns:320px 1fr;gap:16px}
    .card{background:var(--card);border-radius:12px;padding:12px;border:1px solid #e6eef8;box-shadow:0 8px 20px rgba(30,58,95,0.05)}

    /* Controls */
    .controls{display:flex;flex-direction:column;gap:12px}
    .controls h3{margin:0 0 6px 0}
    .filter-group{display:flex;flex-direction:column;gap:8px}
    .checkbox-row{display:flex;flex-wrap:wrap;gap:8px}
    .chip{padding:8px 10px;border-radius:8px;border:1px solid #dbeafe;background:#f8fbff;color:var(--blue);font-weight:700;cursor:pointer}
    input[type=date], input[type=time], input[type=text], select{padding:8px;border-radius:8px;border:1px solid #e2eef9}
    .btn{background:linear-gradient(135deg,var(--blue),var(--lightBlue));color:white;padding:10px;border-radius:10px;border:none;cursor:pointer;font-weight:700}

    /* Heatmap & legend */
    .map-area{display:flex;flex-direction:column;gap:10px}
    .map-card{border-radius:12px;background:#fff;border:1px solid #e6eef8;display:flex;flex-direction:column;overflow:hidden}
    .map-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #f1f5f9}
    #crimeHeatmap{width:100%;height:440px;border-radius:0;position:relative}
    .legend{display:flex;gap:10px;align-items:center}
    .legend .item{display:flex;gap:8px;align-items:center}
    .legend .sw{width:24px;height:14px;border-radius:4px}
    .sw.safe{background:linear-gradient(90deg,#bff0d9,#10b981)}
    .sw.hot{background:linear-gradient(90deg,#ffd6d6,#ef4444)}

    /* Stats cards and table */
    .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
    .stat{padding:12px;border-radius:10px;background:linear-gradient(180deg,#fff,#f8fbff);border:1px solid #e6eef8}
    .stat h4{margin:0;font-size:18px}
    .stat p{margin:6px 0 0 0;color:var(--muted)}
    table{width:100%;border-collapse:collapse}
    th,td{padding:8px;border-bottom:1px solid #eef6ff;text-align:left}
    th{background:#f8fbff}

    /* Responsive */
    @media(max-width:980px){.layout{grid-template-columns:1fr}#crimeHeatmap{height:340px}.stats-row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand"><i class="fas fa-shield-alt"></i><h2>SecureStep — Crime Heatmap</h2></div>
      <div style="color:var(--muted);font-weight:700">Interactive safety analytics and incident heatmap view.</div>
    </div>

    <div class="layout">
      <!-- Left panel: filters -->
      <aside class="card controls">
        <div>
          <h3>Filters</h3>
          <div class="filter-group">
            <label style="font-weight:700">Crime Types</label>
            <div class="checkbox-row" id="crimeTypes">
              <label class="chip"><input type="checkbox" value="Theft" checked style="margin-right:8px">Theft</label>
              <label class="chip"><input type="checkbox" value="Harassment" checked style="margin-right:8px">Harassment</label>
              <label class="chip"><input type="checkbox" value="Assault" checked style="margin-right:8px">Assault</label>
              <label class="chip"><input type="checkbox" value="Accident" checked style="margin-right:8px">Accident</label>
              <label class="chip"><input type="checkbox" value="Suspicious" checked style="margin-right:8px">Suspicious Activity</label>
            </div>
          </div>

          <div class="filter-group">
            <label style="font-weight:700">Date Range</label>
            <div style="display:flex;gap:8px">
              <input type="date" id="dateFrom">
              <input type="date" id="dateTo">
            </div>
          </div>

          <div class="filter-group">
            <label style="font-weight:700">Time Range</label>
            <div style="display:flex;gap:8px">
              <input type="time" id="timeFrom">
              <input type="time" id="timeTo">
            </div>
          </div>

          <div class="filter-group">
            <label style="font-weight:700">Search Area</label>
            <input type="text" id="searchArea" placeholder="e.g., Koramangala, Indiranagar, MG Road">
          </div>

          <div style="display:flex;gap:8px;margin-top:8px">
            <button class="btn" id="applyFilters">Apply Filters</button>
            <button class="btn" id="resetFilters" style="background:transparent;color:var(--blue);border:1px solid #d0e8ff">Reset</button>
          </div>
        </div>

        <hr style="border:none;border-top:1px solid #eef6ff;margin:8px 0">

        <div>
          <h3>Legend</h3>
          <div class="legend">
            <div class="item"><div class="sw safe"></div><div style="color:var(--muted)">Low Risk</div></div>
            <div class="item"><div class="sw hot"></div><div style="color:var(--muted)">High Risk</div></div>
          </div>
        </div>
      </aside>

      <!-- Right panel: map and stats -->
      <section class="map-area">
        <div class="stats-row">
          <div class="stat card"><h4 id="totalIncidents">--</h4><p>Total Incidents</p></div>
          <div class="stat card"><h4 id="hotspots">--</h4><p>Hotspots</p></div>
          <div class="stat card"><h4 id="recent24">--</h4><p>Last 24 hrs</p></div>
        </div>

        <div class="map-card card" style="padding:0;">
          <div class="map-header">
            <div style="font-weight:800"><i class="fas fa-fire" style="color:#ef4444;margin-right:6px;"></i> Live Crime Density Heatmap (OpenFreeMap)</div>
            <div style="display:flex;gap:8px;align-items:center">
              <button class="btn" id="toggleHeat">Toggle Heat</button>
              <button class="btn" id="exportCSV" style="background:transparent;color:var(--blue);border:1px solid #d0e8ff">Export CSV</button>
            </div>
          </div>

          <div id="crimeHeatmap"></div>

          <div style="padding:16px;border-top:1px solid #f1f5f9;">
            <h4 style="margin:0 0 8px 0">Recent Incidents</h4>
            <div style="overflow:auto;max-height:220px">
              <table id="incidentsTable"><thead><tr><th>Type</th><th>Date</th><th>Time</th><th>Location</th><th>Severity</th></tr></thead><tbody></tbody></table>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="js/map-loader.js"></script>
  <script>
    (function() {
      'use strict';

      // Known Bangalore landmark anchors for realistic spatial distribution
      const BANGALORE_LOCATIONS = [
        { name: 'MG Road', lat: 12.9756, lng: 77.6066 },
        { name: 'Indiranagar', lat: 12.9784, lng: 77.6408 },
        { name: 'Koramangala', lat: 12.9352, lng: 77.6245 },
        { name: 'Whitefield', lat: 12.9698, lng: 77.7499 },
        { name: 'Jayanagar', lat: 12.9308, lng: 77.5838 },
        { name: 'Hebbal', lat: 13.0358, lng: 77.5970 },
        { name: 'Malleshwaram', lat: 13.0031, lng: 77.5643 },
        { name: 'Electronic City', lat: 12.8452, lng: 77.6602 },
        { name: 'Majestic', lat: 12.9767, lng: 77.5713 },
        { name: 'HSR Layout', lat: 12.9121, lng: 77.6446 },
        { name: 'Frazer Town', lat: 12.9968, lng: 77.6130 },
        { name: 'Rajajinagar', lat: 12.9982, lng: 77.5530 },
        { name: 'BTM Layout', lat: 12.9166, lng: 77.6101 },
        { name: 'Banashankari', lat: 12.9255, lng: 77.5468 },
        { name: 'Yelahanka', lat: 13.1007, lng: 77.5963 }
      ];

      const incidents = [];
      let heatmapMap = null;
      let heatVisible = true;

      // Generate realistic incidents scattered around Bangalore
      function generateIncidents() {
        const types = ['Theft', 'Harassment', 'Assault', 'Accident', 'Suspicious'];
        const now = new Date();

        for (let i = 0; i < 90; i++) {
          const locAnchor = BANGALORE_LOCATIONS[Math.floor(Math.random() * BANGALORE_LOCATIONS.length)];
          const minutesAgo = Math.floor(Math.random() * 60 * 24 * 14); // past 14 days
          const d = new Date(now.getTime() - minutesAgo * 60000);
          
          // Add small jitter (~300m - 1km)
          const latJitter = (Math.random() - 0.5) * 0.018;
          const lngJitter = (Math.random() - 0.5) * 0.018;
          const sev = Math.random() > 0.65 ? 'High' : (Math.random() > 0.35 ? 'Medium' : 'Low');

          incidents.push({
            id: i + 1,
            type: types[Math.floor(Math.random() * types.length)],
            date: d.toISOString().slice(0, 10),
            time: d.toTimeString().slice(0, 5),
            loc: locAnchor.name,
            lat: locAnchor.lat + latJitter,
            lng: locAnchor.lng + lngJitter,
            severity: sev,
            weight: sev === 'High' ? 1.0 : (sev === 'Medium' ? 0.6 : 0.3)
          });
        }
      }

      function toGeoJson(list) {
        return {
          type: 'FeatureCollection',
          features: list.map(item => ({
            type: 'Feature',
            properties: {
              id: item.id,
              type: item.type,
              date: item.date,
              time: item.time,
              loc: item.loc,
              severity: item.severity,
              weight: item.weight
            },
            geometry: {
              type: 'Point',
              coordinates: [item.lng, item.lat]
            }
          }))
        };
      }

      async function initMap() {
        const container = document.getElementById('crimeHeatmap');
        if (!container) return;

        try {
          await window.loadMapLibreApi();

          heatmapMap = await window.SecureStepMap.createMap(container, [77.5946, 12.9716], 12);

          const geojson = toGeoJson(incidents);

          heatmapMap.addSource('crime-incidents', {
            type: 'geojson',
            data: geojson
          });

          // 1. Heatmap layer
          heatmapMap.addLayer({
            id: 'crime-heat',
            type: 'heatmap',
            source: 'crime-incidents',
            maxzoom: 17,
            paint: {
              'heatmap-weight': [
                'interpolate',
                ['linear'],
                ['get', 'weight'],
                0, 0,
                0.5, 0.5,
                1, 1
              ],
              'heatmap-intensity': [
                'interpolate',
                ['linear'],
                ['zoom'],
                0, 1,
                14, 3
              ],
              'heatmap-color': [
                'interpolate',
                ['linear'],
                ['heatmap-density'],
                0, 'rgba(30,58,95,0)',
                0.2, 'rgba(56,189,248,0.6)',
                0.4, 'rgba(16,185,129,0.7)',
                0.7, 'rgba(245,158,11,0.85)',
                1, 'rgba(239,68,68,0.95)'
              ],
              'heatmap-radius': [
                'interpolate',
                ['linear'],
                ['zoom'],
                0, 4,
                12, 22,
                16, 32
              ],
              'heatmap-opacity': [
                'interpolate',
                ['linear'],
                ['zoom'],
                8, 0.95,
                16, 0.5
              ]
            }
          });

          // 2. Point circle layer (visible as user zooms in)
          heatmapMap.addLayer({
            id: 'crime-points',
            type: 'circle',
            source: 'crime-incidents',
            minzoom: 11,
            paint: {
              'circle-radius': [
                'interpolate',
                ['linear'],
                ['zoom'],
                11, 4,
                16, 9
              ],
              'circle-color': [
                'match',
                ['get', 'severity'],
                'High', '#ef4444',
                'Medium', '#f59e0b',
                '#10b981'
              ],
              'circle-stroke-color': '#ffffff',
              'circle-stroke-width': 2,
              'circle-opacity': 0.9
            }
          });

          // Popup on point click
          heatmapMap.on('click', 'crime-points', (e) => {
            const f = e.features[0];
            if (!f) return;
            const props = f.properties;
            const coords = f.geometry.coordinates.slice();

            const sevColor = props.severity === 'High' ? '#ef4444' : (props.severity === 'Medium' ? '#f59e0b' : '#10b981');
            const popupHtml = `
              <div style="font-family:sans-serif;min-width:180px;">
                <div style="font-weight:800;font-size:14px;color:#0f172a;margin-bottom:4px;">
                  <i class="fas fa-exclamation-triangle" style="color:${sevColor}"></i> ${props.type}
                </div>
                <div style="font-size:12px;color:#64748b;margin-bottom:6px;">
                  <i class="fas fa-location-dot"></i> ${props.loc}
                </div>
                <div style="display:flex;justify-content:space-between;font-size:11px;color:#475569;background:#f8fafc;padding:4px 6px;border-radius:6px;">
                  <span>${props.date} ${props.time}</span>
                  <strong style="color:${sevColor}">${props.severity}</strong>
                </div>
              </div>
            `;

            new maplibregl.Popup({ offset: 12 })
              .setLngLat(coords)
              .setHTML(popupHtml)
              .addTo(heatmapMap);
          });

          heatmapMap.on('mouseenter', 'crime-points', () => {
            heatmapMap.getCanvas().style.cursor = 'pointer';
          });
          heatmapMap.on('mouseleave', 'crime-points', () => {
            heatmapMap.getCanvas().style.cursor = '';
          });

          applyFilters();
        } catch (err) {
          console.error('Failed to initialize MapLibre Heatmap:', err);
          container.innerHTML = '<div style="padding:20px;color:#ef4444;text-align:center;">Failed to initialize MapLibre Heatmap.</div>';
        }
      }

      function formatNumber(n) { return n == null ? '--' : n; }

      function updateStats(filtered) {
        document.getElementById('totalIncidents').textContent = formatNumber(filtered.length);
        const hotspots = filtered.filter(f => f.severity === 'High').length;
        document.getElementById('hotspots').textContent = hotspots;
        const last24 = filtered.filter(f => {
          const dt = new Date(f.date + 'T' + f.time);
          return (Date.now() - dt.getTime()) < 24 * 3600 * 1000;
        }).length;
        document.getElementById('recent24').textContent = last24;
      }

      function renderTable(filtered) {
        const tbody = document.querySelector('#incidentsTable tbody');
        if (!tbody) return;
        tbody.innerHTML = '';
        filtered.slice(0, 100).forEach(r => {
          const tr = document.createElement('tr');
          const color = r.severity === 'High' ? '#ef4444' : (r.severity === 'Medium' ? '#f59e0b' : '#10b981');
          tr.innerHTML = `
            <td><strong>${r.type}</strong></td>
            <td>${r.date}</td>
            <td>${r.time}</td>
            <td>${r.loc}</td>
            <td><span style="color:${color};font-weight:700;">${r.severity}</span></td>
          `;
          tbody.appendChild(tr);
        });
      }

      function applyFilters() {
        const checked = Array.from(document.querySelectorAll('#crimeTypes input:checked')).map(i => i.value);
        const from = document.getElementById('dateFrom').value;
        const to = document.getElementById('dateTo').value;
        const tFrom = document.getElementById('timeFrom').value;
        const tTo = document.getElementById('timeTo').value;
        const area = document.getElementById('searchArea').value.trim().toLowerCase();

        let filtered = incidents.filter(i => checked.includes(i.type));
        if (from) filtered = filtered.filter(i => i.date >= from);
        if (to) filtered = filtered.filter(i => i.date <= to);
        if (tFrom) filtered = filtered.filter(i => i.time >= tFrom);
        if (tTo) filtered = filtered.filter(i => i.time <= tTo);
        if (area) filtered = filtered.filter(i => i.loc.toLowerCase().includes(area));

        // Update GeoJSON source
        if (heatmapMap && heatmapMap.getSource('crime-incidents')) {
          heatmapMap.getSource('crime-incidents').setData(toGeoJson(filtered));

          // If specific area searched, fit to filtered bounds
          if (area && filtered.length > 0) {
            const coords = filtered.map(f => [f.lng, f.lat]);
            window.SecureStepMap.fitBounds(heatmapMap, coords);
          }
        }

        updateStats(filtered);
        renderTable(filtered);
      }

      function resetFilters() {
        document.querySelectorAll('#crimeTypes input').forEach(i => i.checked = true);
        document.getElementById('dateFrom').value = '';
        document.getElementById('dateTo').value = '';
        document.getElementById('timeFrom').value = '';
        document.getElementById('timeTo').value = '';
        document.getElementById('searchArea').value = '';
        applyFilters();
        if (heatmapMap) {
          heatmapMap.flyTo({ center: [77.5946, 12.9716], zoom: 12 });
        }
      }

      // Event listeners
      document.getElementById('applyFilters').addEventListener('click', applyFilters);
      document.getElementById('resetFilters').addEventListener('click', resetFilters);

      document.getElementById('toggleHeat').addEventListener('click', function() {
        if (!heatmapMap) return;
        heatVisible = !heatVisible;
        const visibility = heatVisible ? 'visible' : 'none';
        if (heatmapMap.getLayer('crime-heat')) {
          heatmapMap.setLayoutProperty('crime-heat', 'visibility', visibility);
        }
        this.textContent = heatVisible ? 'Hide Heat' : 'Show Heat';
      });

      document.getElementById('exportCSV').addEventListener('click', function() {
        const rows = ['Type,Date,Time,Location,Latitude,Longitude,Severity'];
        const checked = Array.from(document.querySelectorAll('#crimeTypes input:checked')).map(i => i.value);
        const from = document.getElementById('dateFrom').value;
        const to = document.getElementById('dateTo').value;
        const area = document.getElementById('searchArea').value.trim().toLowerCase();

        let filtered = incidents.filter(i => checked.includes(i.type));
        if (from) filtered = filtered.filter(i => i.date >= from);
        if (to) filtered = filtered.filter(i => i.date <= to);
        if (area) filtered = filtered.filter(i => i.loc.toLowerCase().includes(area));

        if (filtered.length === 0) return alert('No records found to export');

        filtered.forEach(r => {
          rows.push(`"${r.type}","${r.date}","${r.time}","${r.loc}",${r.lat},${r.lng},"${r.severity}"`);
        });

        const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'crime_heatmap_incidents.csv';
        a.click();
        URL.revokeObjectURL(url);
      });

      // Initialize
      generateIncidents();
      document.addEventListener('DOMContentLoaded', () => {
        initMap();
        updateStats(incidents);
        renderTable(incidents);
      });
    })();
  </script>
</body>
</html>
